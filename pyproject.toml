[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mctutil"
version = "0.0.0"
description = "MicroCT data tooling used by the Cheng Lab at PSU."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Cheng Lab contributors" },
]
dependencies = [
  "click>=8.1,<9",
  "natsort>=8.4,<9",
  "numpy>=1.24,<2",
  "psutil>=5.9,<8",
  "ruamel.yaml>=0.17,<0.19",
]
# The supported full runtime is still managed through environment.yml so
# TomoPy and other conda-forge-first packages can be installed consistently.

[project.optional-dependencies]
als832 = [
  "h5py>=3.10,<4",
  "tifffile>=2024.8.30,<2025.5.21",
]
flats = [
  "scipy>=1.10,<1.16",
  "tifffile>=2024.8.30,<2025.5.21",
]
transform = [
  "h5py>=3.10,<4",
  "tifffile>=2024.8.30,<2025.5.21",
  "zarr>=2.18,<3",
]
ng = [
  "cloud-files>=6.1.1,<7",
  "cloud-volume>=12.13,<13",
  "neuroglancer-scripts>=1.2,<2",
  "tifffile>=2024.8.30,<2025.5.21",
  "zarr>=2.18,<3",
]
serve = [
  "flask>=3.1,<4",
  "flask-cors>=6,<7",
  "neuroglancer>=2.40,<3",
  "qrcode[pil]>=8,<9",
  "rangehttpserver>=1.4,<2",
]
sino = [
  "scikit-image>=0.22,<0.26",
  "tifffile>=2024.8.30,<2025.5.21",
]
mesh = [
  "cloud-volume>=12.13,<13",
  "igneous-pipeline>=4.36,<5",
  "task-queue>=2.14,<3",
]
aws = [
  "cloud-volume>=12.13,<13",
  "boto3>=1.34,<2",
]
# ORS Dragonfly is Windows-only and runs these scripts inside its embedded
# Python console (config.pythonConsoleAutoImport); it is not published on
# PyPI, so there is no pip-installable dependency to declare. The extra is
# kept empty to reserve and document the name.
dragonfly = []

[project.scripts]
mctutil = "mctutil.cli:main"

[project.urls]
Repository = "https://github.com/den-sq/mctutil"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "mctutil*",
  "chenglab*",
]

[tool.setuptools.package-data]
"mctutil.mem" = ["config/*.json"]
