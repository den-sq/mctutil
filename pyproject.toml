[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mctutil"
version = "0.0.0"
description = "MicroCT data tooling used by the Cheng Lab at PSU."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Cheng Lab contributors" },
]
# Runtime dependencies are managed through environment.yml so TomoPy and other
# non-PyPI-first packages can be sourced from conda-forge.

[project.optional-dependencies]
als832 = [
  "h5py",
  "tifffile",
]
flats = [
  "scipy",
  "tifffile",
]
transform = [
  "h5py",
  "numpy",
  "tifffile",
  "zarr<3",
]
ng = [
  "cloud-files",
  "cloud-volume",
  "neuroglancer-scripts",
  "zarr<3",
]
# The recon half of the sinogram stack (tomopy) is conda-forge-only and stays
# in environment.yml; scikit-image is the pip-installable stack dependency.
sino = [
  "scikit-image",
]
mesh = [
  "igneous-pipeline",
  "task-queue",
]
aws = [
  "cloud-volume",
  "boto3",
]
# ORS Dragonfly is Windows-only and runs these scripts inside its embedded
# Python console (config.pythonConsoleAutoImport); it is not published on
# PyPI, so there is no pip-installable dependency to declare. The extra is
# kept empty to reserve and document the name.
dragonfly = []

[project.scripts]
mctutil = "mctutil.cli:main"

[project.urls]
Repository = "https://github.com/den-sq/mctutil"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "mctutil*",
  "chenglab*",
]

[tool.setuptools.package-data]
"mctutil.mem" = ["config/*.json"]
