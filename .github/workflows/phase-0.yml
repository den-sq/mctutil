name: Phase 0 CI

on:
  push:
    branches:
      - master
      - refactor
  pull_request:
    branches:
      - master
      - refactor

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install package
        run: poetry install --with dev

      - name: Lint
        run: |
          poetry run flake8 mctutil scripts tests
          poetry run python scripts/check_python_tabs.py

      - name: Smoke tests
        run: poetry run pytest tests/
