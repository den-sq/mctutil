name: mctutil
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.13
  - pip
  - boto3>=1.34,<2
  - brotli
  - click>=8.1,<9
  - flake8
  - gdal
  - google-api-python-client
  - google-auth
  - google-auth-oauthlib
  - h5py>=3.10,<4
  - ipyslurm
  - natsort>=8.4,<9
  - numpy>=1.24,<2
  - opencv
  - psutil>=5.9,<8
  - pytest
  - ruamel.yaml>=0.17,<0.19
  - scikit-image>=0.22,<0.26
  - scipy>=1.10,<1.16
  - tifffile>=2024.8.30,<2025.5.21
  - tomopy>=1.15,<2
  - pip:
      # Pip resolves this subsection independently from conda. Repeat the ABI
      # bound so igneous cannot upgrade NumPy through opencv-python-headless.
      - numpy>=1.24,<2
      - cloud-files>=6.1.1,<7
      - cloud-volume>=12.13,<13
      - dicom2jpg
      - flask>=3.1,<4
      - flask-cors>=6,<7
      - igneous-pipeline>=4.36,<5
      - neuroglancer>=2.40,<3
      - neuroglancer-scripts>=1.2,<2
      - qrcode[pil]>=8,<9
      - rangehttpserver>=1.4,<2
      - task-queue>=2.14,<3
      - zarr>=2.18,<3
